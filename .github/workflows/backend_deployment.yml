name: Wipster backend on msf
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/msf/**', '.github/workflows/backend_deployment.yml']
permissions:
  contents: read
concurrency:
  group: wipster-msf-production
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
        env:
          POSTGRES_DB: wipster
          POSTGRES_USER: wipster
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wipster -d wipster"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DEBUG: 'true'
      GOOGLE_ENABLED: 'false'
      OTP_PROVIDER: development
      DEV_OTP_ENABLED: 'true'
      DATABASE_URL: postgresql://wipster:ci-only@127.0.0.1:5432/wipster
    outputs:
      image: ${{ steps.package.outputs.image }}
      archive: ${{ steps.package.outputs.archive }}
      ops: ${{ steps.package.outputs.ops }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py check
      - run: pytest -q backend/tests_cloud
      - name: Validate deployment source
        run: |
          shellcheck deploy/msf/*.sh deploy/msf/nginx/*.sh
          python -m unittest discover -s deploy/msf -p 'test_*.py'
      - name: Build immutable amd64 backend
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "wipster-backend:$GITHUB_SHA" backend
      - name: Isolated container smoke and backup restore
        run: deploy/msf/smoke.sh "wipster-backend:$GITHUB_SHA"
      - name: Package verified image
        id: package
        run: |
          docker save "wipster-backend:$GITHUB_SHA" | gzip -1 > backend-image.tar.gz
          image_id=$(docker image inspect "wipster-backend:$GITHUB_SHA" --format '{{.Id}}')
          python deploy/msf/verify_archive.py backend-image.tar.gz "$GITHUB_SHA" "$image_id"
          archive_sha=$(sha256sum backend-image.tar.gz | cut -d' ' -f1)
          ops_sha=$(python deploy/msf/ops_hash.py)
          python -c 'import json,sys; print(json.dumps(dict(zip(("source", "image", "archive_sha256", "ops_sha256"), sys.argv[1:])), indent=2))' "$GITHUB_SHA" "$image_id" "$archive_sha" "$ops_sha" > backend-image.json
          {
            echo "image=$image_id"
            echo "archive=$archive_sha"
            echo "ops=$ops_sha"
          } >> "$GITHUB_OUTPUT"
          cat backend-image.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: |
            backend-image.tar.gz
            backend-image.json
          retention-days: 14
  deploy:
    needs: verify-build
    if: github.ref == 'refs/heads/main' && vars.WIPSTER_DEPLOY_ENABLED == 'true'
    environment: wipster-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
      - name: Deploy reviewed immutable artifact through restricted SSH
        env:
          DEPLOY_KEY: ${{ secrets.WIPSTER_MSF_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.WIPSTER_MSF_KNOWN_HOSTS }}
          IMAGE_ID: ${{ needs.verify-build.outputs.image }}
          ARCHIVE_SHA: ${{ needs.verify-build.outputs.archive }}
          OPS_SHA: ${{ needs.verify-build.outputs.ops }}
        run: |
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$key_dir/known_hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          test "$(sha256sum backend-image.tar.gz | cut -d' ' -f1)" = "$ARCHIVE_SHA"
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" -o IdentitiesOnly=yes -i "$key_dir/key" fedotov@95.84.162.15 "deploy $GITHUB_SHA $IMAGE_ID $ARCHIVE_SHA $OPS_SHA" < backend-image.tar.gz
      - name: Verify public HTTPS and active source
        run: |
          curl --fail --silent --show-error --max-time 15 https://wipster.fedotovs.net/healthz
          curl --fail --silent --show-error --max-time 15 -D headers.txt https://wipster.fedotovs.net/readyz
          grep -Fi "X-Wipster-Release:" headers.txt | grep -F "$GITHUB_SHA"
          curl --fail --silent --show-error --max-time 15 https://wipster.fedotovs.net/api/v1/auth/capabilities > capabilities.json
          python -c 'import json; d=json.load(open("capabilities.json")); assert d["google"] is True; assert d["sms"] is False'
