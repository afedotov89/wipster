name: Cloud and native verification
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wipster
          POSTGRES_USER: wipster
          POSTGRES_PASSWORD: ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U wipster" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DEBUG: 'true'
      OTP_PROVIDER: development
      DEV_OTP_ENABLED: 'true'
      DATABASE_URL: postgresql://wipster:ci-only@localhost:5432/wipster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py check
      - run: pytest -q backend/tests_cloud
  native-and-frontend:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo test --locked --lib
        working-directory: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native sync over local development HTTP
        env:
          DEBUG: 'true'
          DEV_OTP_ENABLED: 'true'
          OTP_PROVIDER: development
          DATABASE_URL: sqlite:///${{ runner.temp }}/wipster-cloud-ci.sqlite3
          WIPSTER_TEST_API: http://127.0.0.1:8080
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.lock
          backend/.venv/bin/python backend/manage.py migrate --noinput
          backend/.venv/bin/python backend/manage.py runserver 127.0.0.1:8080 --noreload > "$RUNNER_TEMP/wipster-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for ((attempt=1; attempt<=20; attempt++)); do
            if curl -fsS http://127.0.0.1:8080/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_two_clients_http_offline_retry_conflict_delete -- --ignored
      - name: Native Google flow with signed provider fixture
        env:
          DEBUG: 'true'
          DEV_OTP_ENABLED: 'true'
          OTP_PROVIDER: disabled
          GOOGLE_ENABLED: 'true'
          GOOGLE_CLIENT_ID: local-test.apps.googleusercontent.com
          WIPSTER_GOOGLE_TEST_PROVIDER: '1'
          DATABASE_URL: sqlite:///${{ runner.temp }}/wipster-google-ci.sqlite3
          WIPSTER_TEST_API: http://127.0.0.1:8081
        run: |
          backend/.venv/bin/python backend/manage.py migrate --noinput
          backend/.venv/bin/gunicorn --chdir backend tests_cloud.google_mock_wsgi:application --bind 127.0.0.1:8081 --workers 2 > "$RUNNER_TEMP/wipster-google-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for ((attempt=1; attempt<=20; attempt++)); do
            if curl -fsS http://127.0.0.1:8081/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/readyz
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_google_two_device_sessions_over_http -- --ignored
      - name: Native Yandex flow over isolated PostgreSQL and fixture HTTP
        env:
          DEBUG: 'true'
          DEV_OTP_ENABLED: 'true'
          OTP_PROVIDER: disabled
          GOOGLE_ENABLED: 'false'
          YANDEX_ENABLED: 'true'
          YANDEX_CLIENT_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WIPSTER_YANDEX_TEST_PROVIDER: '1'
          WIPSTER_TEST_API: http://127.0.0.1:18082
        run: |
          brew install postgresql@18
          pg_bin="$(brew --prefix postgresql@18)/bin"
          pg_dir=$(mktemp -d "$RUNNER_TEMP/wipster-yandex-pg.XXXXXX")
          "$pg_bin/initdb" -D "$pg_dir/data" -A trust --no-locale > "$pg_dir/init.log"
          api_pid=
          cleanup() {
            if [[ -n $api_pid ]]; then kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true; fi
            "$pg_bin/pg_ctl" -D "$pg_dir/data" -m fast stop > /dev/null || true
            rm -rf "$pg_dir"
          }
          trap cleanup EXIT
          "$pg_bin/pg_ctl" -D "$pg_dir/data" -l "$pg_dir/postgres.log" -o "-h 127.0.0.1 -p 55432 -k $pg_dir -c max_connections=30 -c shared_buffers=32MB" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55432 wipster_yandex_ci
          DATABASE_URL="postgresql://$(id -un)@127.0.0.1:55432/wipster_yandex_ci"
          export DATABASE_URL
          backend/.venv/bin/python backend/manage.py migrate --noinput
          backend/.venv/bin/gunicorn --chdir backend tests_cloud.yandex_mock_wsgi:application --bind 127.0.0.1:18082 --workers 2 --access-logfile /dev/null --error-logfile /dev/null --capture-output &
          api_pid=$!
          for ((attempt=1; attempt<=30; attempt++)); do
            if curl -fsS "$WIPSTER_TEST_API/readyz" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$WIPSTER_TEST_API/readyz"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_yandex_two_device_sessions_over_http -- --ignored
