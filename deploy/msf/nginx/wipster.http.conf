# Bootstrap only. Install the TLS vhost after a dedicated ACME certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name wipster.fedotovs.net;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wipster-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
