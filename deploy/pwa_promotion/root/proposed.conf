# Entire file is Wipster-owned; no shared maps, formats or zones are modified.
log_format wipster_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=wipster_api:1m rate=20r/s;
server {
    listen 80;
    listen [::]:80;
    server_name wipster.fedotovs.net;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wipster-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://wipster.fedotovs.net$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wipster.fedotovs.net;
    ssl_certificate /etc/letsencrypt/live/wipster.fedotovs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wipster.fedotovs.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/wipster.access.log wipster_safe;
    error_log /dev/null;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 8m;
    client_body_timeout 15s;
    send_timeout 30s;
    root /srv/wipster/site;
    location = / {
    proxy_pass http://127.0.0.1:18180;
    proxy_http_version 1.1;
    proxy_set_header Host wipster.fedotovs.net;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_request_buffering off;
    proxy_buffering off;
}
    # Privacy draft is deliberately NOT served; publish only after owner review.
    location / {
        limit_req zone=wipster_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host wipster.fedotovs.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
